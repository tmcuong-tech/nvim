---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Neovim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      NVIM_DISABLE_MASON_AUTO_INSTALL: "1"
      XDG_CONFIG_HOME: ${{ github.workspace }}
      XDG_DATA_HOME: ${{ github.workspace }}/.nvim-data

    steps:
      - name: Check out configuration
        uses: actions/checkout@v4
        with:
          path: nvim

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: v0.11.4
          neovim: true

      - name: Install pinned plugins
        working-directory: nvim
        run: nvim --headless -i NONE "+Lazy! sync" +qa

      - name: Load and validate all plugins
        working-directory: nvim
        run: >-
          nvim --headless -i NONE -c
          "lua local ok,err=xpcall(function()
          vim.cmd('ConfigValidate') end,debug.traceback);
          if ok then vim.cmd('qa!') else vim.api.nvim_err_writeln(err);
          vim.cmd('cquit 1') end"

      - name: Check Git whitespace
        working-directory: nvim
        run: git diff --check
